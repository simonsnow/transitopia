name: Deploy Preview
run-name: Deploy ${{ inputs.source_ref }} to preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to publish to the shared preview
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Update preview branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Point preview at the selected commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" == "preview" ]]; then
            echo "::error::Choose a source ref other than preview."
            exit 1
          fi

          source_commit="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "Preview deploy: ${SOURCE_REF} (${source_commit:0:7})"
          preview_commit="$(git rev-parse HEAD)"

          remote_preview="$(git ls-remote --heads origin refs/heads/preview)"
          expected="${remote_preview%%$'\t'*}"
          git push --force-with-lease="refs/heads/preview:$expected" \
            origin HEAD:refs/heads/preview

          {
            echo "Updated \`preview\` to \`${preview_commit:0:7}\` (empty deployment commit) based on \`${source_commit:0:7}\` from \`$SOURCE_REF\`."
            echo
            echo "Cloudflare Pages preview deployment URL: \`https://<hash>.transitopia.pages.dev\` (see Cloudflare deployment details for the generated hash)."
          } >> "$GITHUB_STEP_SUMMARY"
